# Example values for the Novu Helm chart.
# Copy this file and customize it for your environment.

global:
  # MongoDB username used when the chart creates the credentials secret.
  mongodb:
    username: "novu"
    password: ""

  # Redis connection settings
  redis:
    port: "6379"
    password: ""
    dbIndex: "2"

  # Public URLs (used for links and the dashboard runtime configuration)
  apiRootUrl: "https://novu.example.com/api"
  frontBaseURL: "https://novu.example.com"
  dashboardUrl: "https://novu.example.com"

  # Context paths must match the ingress paths
  apiContextPath: "/api"
  wsContextPath: "/ws"

  # Service ports
  apiPort: "3000"
  workerPort: "3004"
  wsPort: "3001"

  # Dashboard runtime configuration
  viteApiHostname: "https://novu.example.com/api"
  viteWebSocketHostname: "https://novu.example.com/ws"

  isSelfHosted: "true"

  # Set to "true" after creating the first admin to make onboarding invite-only.
  disableUserRegistration: "false"

redis:
  enabled: true
  image:
    repository: redis
    tag: alpine

mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "8.0.17"
  persistence:
    size: 8Gi

api:
  enabled: true
  image:
    repository: ghcr.io/novuhq/novu/api
    tag: "3.19.0"

worker:
  enabled: true
  image:
    repository: ghcr.io/novuhq/novu/worker
    tag: "3.19.0"

ws:
  enabled: true
  image:
    repository: ghcr.io/novuhq/novu/ws
    tag: "3.19.0"

dashboard:
  enabled: true
  image:
    repository: ghcr.io/novuhq/novu/dashboard
    tag: "3.19.0"

ingress:
  enabled: true
  host: novu.example.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  tlsSecretName: novu-example-com-tls
