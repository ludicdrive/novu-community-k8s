# Default values for novu.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# IMPORTANT: Secrets Management
# ----------------------------
# For security, sensitive secrets should be created externally and managed outside of Helm values.
# The chart provides pre-secrets.yaml which will only create secrets if they don't already exist.
# See README.md for instructions on creating these secrets.
# Required secrets: mongodb (username/password), application secrets (jwt-secret, store-encryption-key, novu-secret-key)

global:
  # MongoDB configuration (username/password should be pre-created secrets)
  # These values are used as defaults but credentials come from pre-created secrets
  mongodb:
    username: "novu"  # Must match the username in pre-created mongodb secret
    password: ""      # Should be empty if using pre-created secret with password

  # Redis configuration (for both Redis and Redis Cache)
  redis:

  # Redis configuration (for both Redis and Redis Cache)
  redis:

  # Redis configuration (for both Redis and Redis Cache)
  redis:
    host: "redis"
    port: "6379"
    password: ""
    dbIndex: "2"

  # Service ports
  apiPort: "3000"
  workerPort: "3004"
  wsPort: "3001"

# Redis service configuration
redis:
  enabled: true
  image:
    repository: redis
    tag: alpine
  containerName: redis
  resources: {}
  # Logging config (same as docker-compose)
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"
  healthcheck:
    enabled: true
    test: ["CMD", "redis-cli", "ping"]
    interval: 10s
    timeout: 5s
    retries: 5

# MongoDB service configuration
mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "8.0.17"
  containerName: mongodb
  resources: {}
  # Logging config (same as docker-compose)
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"
  persistence:
    enabled: true
    storageClass: ""
    size: 8Gi
  # Environment variables are set from pre-created secrets (see mongodb secret)
  environment:
    MONGO_INITDB_ROOT_USERNAME: ""
    MONGO_INITDB_ROOT_PASSWORD: ""
  healthcheck:
    enabled: true
    test:
      - CMD
      - mongosh
      - --quiet
      - --username
      - "{{ .Values.global.mongodb.username }}"
      - --password
      - "{{ .Values.global.mongodb.password }}"
      - --eval
      - db.adminCommand('ping').ok
    interval: 20s
    timeout: 5s
    retries: 5
    startPeriod: 20s

# API service configuration
api:
  enabled: true
  image:
    repository: ghcr.io/novuhq/novu/api
    tag: "3.19.0"
  containerName: api
  resources: {}
  ports:
    http:
      port: "{{ .Values.global.apiPort }}"
      target: "{{ .Values.global.apiPort }}"
  environment:
    NODE_ENV: production
    API_ROOT_URL: ""
    PORT: "{{ .Values.global.apiPort }}"
    FRONT_BASE_URL: ""
    MONGO_URL: ""
    MONGO_MIN_POOL_SIZE: "1"
    MONGO_MAX_POOL_SIZE: "10"
    REDIS_HOST: "{{ .Values.global.redis.host }}"
    REDIS_PORT: "{{ .Values.global.redis.port }}"
    REDIS_PASSWORD: ""
    REDIS_DB_INDEX: "2"
    REDIS_CACHE_SERVICE_HOST: ""
    REDIS_CACHE_SERVICE_PORT: ""
    S3_LOCAL_STACK: ""
    S3_BUCKET_NAME: ""
    S3_REGION: ""
    AWS_ACCESS_KEY_ID: ""
    AWS_SECRET_ACCESS_KEY: ""
    JWT_SECRET: ""
    STORE_ENCRYPTION_KEY: ""
    NOVU_SECRET_KEY: ""
    SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME: ""
    SENTRY_DSN: ""
    NEW_RELIC_ENABLED: "false"
    NEW_RELIC_APP_NAME: ""
    NEW_RELIC_LICENSE_KEY: ""
    API_CONTEXT_PATH: ""
    MONGO_AUTO_CREATE_INDEXES: "true"
    IS_API_IDEMPOTENCY_ENABLED: "true"
    IS_API_RATE_LIMITING_ENABLED: "true"
    IS_NEW_MESSAGES_API_RESPONSE_ENABLED: "true"
    IS_V2_ENABLED: "false"
    IS_SELF_HOSTED: "false"
  healthcheck:
    enabled: true
    test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:${API_PORT}/v1/health-check || exit 1
    interval: 20s
    timeout: 10s
    retries: 3
    startPeriod: 40s
  service:
    annotations: {}
    # Example annotations for dashboard service:
    # prometheus.io/scrape: "true"
    # prometheus.io/port: "4000"

# Worker service configuration
worker:
  enabled: true
  image:
    repository: ghcr.io/novuhq/novu/worker
    tag: "3.19.0"
  containerName: worker
  resources: {}
  ports: {}
  environment:
    NODE_ENV: production
    PORT: "{{ .Values.global.workerPort }}"
    MONGO_URL: ""
    MONGO_MIN_POOL_SIZE: "1"
    MONGO_MAX_POOL_SIZE: "10"
    REDIS_HOST: "{{ .Values.global.redis.host }}"
    REDIS_PORT: "{{ .Values.global.redis.port }}"
    REDIS_PASSWORD: ""
    REDIS_DB_INDEX: "2"
    REDIS_CACHE_SERVICE_HOST: ""
    REDIS_CACHE_SERVICE_PORT: ""
    S3_LOCAL_STACK: ""
    S3_BUCKET_NAME: ""
    S3_REGION: ""
    AWS_ACCESS_KEY_ID: ""
    AWS_SECRET_ACCESS_KEY: ""
    STORE_ENCRYPTION_KEY: ""
    SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME: ""
    SENTRY_DSN: ""
    NEW_RELIC_ENABLED: "false"
    NEW_RELIC_APP_NAME: ""
    NEW_RELIC_LICENSE_KEY: ""
    BROADCAST_QUEUE_CHUNK_SIZE: "100"
    MULTICAST_QUEUE_CHUNK_SIZE: "100"
    API_ROOT_URL: "http://api:{{ .Values.global.apiPort }}"
    IS_EMAIL_INLINE_CSS_DISABLED: "false"
    IS_USE_MERGED_DIGEST_ID_ENABLED: "true"
  healthcheck:
    enabled: true
    test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:${WORKER_PORT:-3004}/v1/health-check || exit 1
    interval: 20s
    timeout: 10s
    retries: 3
    startPeriod: 20s
  service:
    annotations: {}
    # Example annotations for dashboard service:
    # prometheus.io/scrape: "true"
    # prometheus.io/port: "4000"

# WebSocket service configuration
ws:
  enabled: true
  image:
    repository: ghcr.io/novuhq/novu/ws
    tag: "3.19.0"
  containerName: ws
  resources: {}
  ports:
    http:
      port: "{{ .Values.global.wsPort }}"
      target: "{{ .Values.global.wsPort }}"
  environment:
    PORT: "{{ .Values.global.wsPort }}"
    NODE_ENV: production
    MONGO_URL: ""
    MONGO_MIN_POOL_SIZE: "1"
    MONGO_MAX_POOL_SIZE: "10"
    REDIS_HOST: "{{ .Values.global.redis.host }}"
    REDIS_PORT: "{{ .Values.global.redis.port }}"
    REDIS_PASSWORD: ""
    JWT_SECRET: ""
    WS_CONTEXT_PATH: ""
    NEW_RELIC_ENABLED: "false"
    NEW_RELIC_APP_NAME: ""
    NEW_RELIC_LICENSE_KEY: ""
  healthcheck:
    enabled: true
    test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:${WS_PORT}/v1/health-check || exit 1
    interval: 20s
    timeout: 10s
    retries: 3
    startPeriod: 40s
  service:
    annotations: {}
    # Example annotations for dashboard service:
    # prometheus.io/scrape: "true"
    # prometheus.io/port: "4000"

# Dashboard service configuration
dashboard:
  enabled: true
  image:
    repository: ghcr.io/novuhq/novu/dashboard
    tag: "3.19.0"
  containerName: dashboard
  resources: {}
  ports:
    http:
      port: 4000
      target: 4000
  environment:
    VITE_API_HOSTNAME: ""
    VITE_WEBSOCKET_HOSTNAME: ""
  healthcheck:
    enabled: true
    test:
      - CMD-SHELL
      - |
        node -e "const http = require('http'); const req = http.get({hostname: 'localhost', port: 4000, path: '/'}, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.on('timeout', () => { req.destroy(); process.exit(1); })"
    interval: 20s
    timeout: 10s
    retries: 3
    startPeriod: 40s
  service:
    annotations: {}
    # Example annotations for dashboard service:
    # prometheus.io/scrape: "true"
    # prometheus.io/port: "4000"

# Ingress configuration
ingress:
  enabled: false
  host: ""
  annotations: {}
  # Example annotations for Traefik:
  # traefik.ingress.kubernetes.io/ssl-redirect: 'true'
  tlsSecretName: ""

# Common settings for all services
common:
  restartPolicy: UnlessStopped
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"
