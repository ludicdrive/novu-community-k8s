# Default values for novu.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# IMPORTANT: Secrets Management
# ----------------------------
# For security, sensitive secrets should be created externally and managed outside of Helm values.
# The chart creates the secrets only if they do not already exist (see pre-secrets.yaml and
# secrets.yaml). If a value below is left empty and the secret does not exist yet, a random
# value is generated on first install.
#
# Required secrets: mongodb (username/password), application secrets
# (jwt-secret, store-encryption-key, novu-secret-key)

global:
  # MongoDB connection settings
  mongodb:
    # Used when the mongodb secret is created by the chart and for the
    # default connection URL.
    username: "novu"
    password: ""
    # Used only when mongodb.enabled=false
    host: "mongodb"
    database: "novu"

  # Redis connection settings
  redis:
    # Used only when redis.enabled=false
    host: "redis"
    port: "6379"
    password: ""
    dbIndex: "2"

  # Explicit MongoDB URL. Leave empty to build it from the mongodb secret.
  mongoUrl: ""

  # Public URL of the API (used for links in notifications/emails)
  apiRootUrl: "http://localhost:3000"
  # Public URL of the dashboard
  frontBaseURL: "http://localhost:4000"
  dashboardUrl: ""

  # URL context paths used by the services. Must match the Ingress paths below.
  globalContextPath: ""
  apiContextPath: ""
  wsContextPath: ""

  # Service ports
  apiPort: "3000"
  workerPort: "3004"
  wsPort: "3001"

  # Dashboard runtime configuration. Use absolute URLs that include the
  # configured context paths, e.g. https://novu.example.com/api
  viteApiHostname: ""
  viteWebSocketHostname: ""

  # MongoDB connection pool
  mongoMinPoolSize: "1"
  mongoMaxPoolSize: "10"
  mongoAutoCreateIndexes: "true"

  # Redis cache (leave empty to use the main Redis instance)
  redisCacheServiceHost: ""
  redisCacheServicePort: ""

  # S3 storage (optional)
  s3LocalStack: "false"
  s3BucketName: ""
  s3Region: "us-east-1"
  awsAccessKeyId: ""
  awsSecretAccessKey: ""

  # Application secrets. Leave empty to generate/preserve them on install.
  jwtSecret: ""
  storeEncryptionKey: ""
  novuSecretKey: ""

  # Optional monitoring
  sentryDsn: ""
  newRelicEnabled: "false"
  newRelicAppName: "novu"
  newRelicLicenseKey: ""

  # Feature flags
  subscriberWidgetJwtExpirationTime: "15 days"
  isApiIdempotencyEnabled: "true"
  isApiRateLimitingEnabled: "true"
  isNewMessagesApiResponseEnabled: "true"
  isV2Enabled: "false"
  isSelfHosted: "true"

  # Set to "true" to disable public /auth/register. Create the first admin
  # account before enabling this, otherwise nobody can sign up.
  disableUserRegistration: "false"

  # Worker tuning
  broadcastQueueChunkSize: "100"
  multicastQueueChunkSize: "100"
  isEmailInlineCssDisabled: "false"
  isUseMergedDigestIdEnabled: "true"

  logLevel: "info"

# Redis service configuration
redis:
  enabled: true
  image:
    repository: redis
    tag: alpine
  resources: {}
  healthcheck:
    enabled: true

# MongoDB service configuration
mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "8.0.17"
  resources: {}
  persistence:
    enabled: true
    storageClass: ""
    size: 8Gi

# API service configuration
api:
  enabled: true
  image:
    repository: ghcr.io/novuhq/novu/api
    tag: "3.19.0"
  resources: {}
  service:
    annotations: {}

# Worker service configuration
worker:
  enabled: true
  image:
    repository: ghcr.io/novuhq/novu/worker
    tag: "3.19.0"
  resources: {}
  service:
    annotations: {}

# WebSocket service configuration
ws:
  enabled: true
  image:
    repository: ghcr.io/novuhq/novu/ws
    tag: "3.19.0"
  resources: {}
  service:
    annotations: {}

# Dashboard service configuration
dashboard:
  enabled: true
  image:
    repository: ghcr.io/novuhq/novu/dashboard
    tag: "3.19.0"
  resources: {}
  service:
    annotations: {}

# Ingress configuration
ingress:
  enabled: false
  host: ""
  annotations: {}
  tlsSecretName: ""
