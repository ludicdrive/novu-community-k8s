{{- /*
  Application secrets.

  Values provided through global.* take precedence. Otherwise existing secret
  data is preserved, and on first install missing required keys are generated
  randomly. This lets the chart work out of the box while still supporting
  externally managed secrets.
*/ -}}
{{- $name := printf "%s-secrets" (include "novu.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $existingData := default (dict) $existing.data -}}

{{- $jwtSecret := .Values.global.jwtSecret | default "" -}}
{{- if and (not $jwtSecret) (hasKey $existingData "jwt-secret") -}}
{{- $jwtSecret = index $existingData "jwt-secret" | b64dec -}}
{{- end -}}
{{- if not $jwtSecret -}}
{{- $jwtSecret = randAlphaNum 32 -}}
{{- end -}}

{{- $storeEncryptionKey := .Values.global.storeEncryptionKey | default "" -}}
{{- if and (not $storeEncryptionKey) (hasKey $existingData "store-encryption-key") -}}
{{- $storeEncryptionKey = index $existingData "store-encryption-key" | b64dec -}}
{{- end -}}
{{- if not $storeEncryptionKey -}}
{{- $storeEncryptionKey = randAlphaNum 32 -}}
{{- end -}}

{{- $novuSecretKey := .Values.global.novuSecretKey | default "" -}}
{{- if and (not $novuSecretKey) (hasKey $existingData "novu-secret-key") -}}
{{- $novuSecretKey = index $existingData "novu-secret-key" | b64dec -}}
{{- end -}}
{{- if not $novuSecretKey -}}
{{- $novuSecretKey = randAlphaNum 32 -}}
{{- end -}}

{{- $awsAccessKeyId := .Values.global.awsAccessKeyId | default "" -}}
{{- if and (not $awsAccessKeyId) (hasKey $existingData "aws-access-key-id") -}}
{{- $awsAccessKeyId = index $existingData "aws-access-key-id" | b64dec -}}
{{- end -}}

{{- $awsSecretAccessKey := .Values.global.awsSecretAccessKey | default "" -}}
{{- if and (not $awsSecretAccessKey) (hasKey $existingData "aws-secret-access-key") -}}
{{- $awsSecretAccessKey = index $existingData "aws-secret-access-key" | b64dec -}}
{{- end -}}

{{- $sentryDsn := .Values.global.sentryDsn | default "" -}}
{{- if and (not $sentryDsn) (hasKey $existingData "sentry-dsn") -}}
{{- $sentryDsn = index $existingData "sentry-dsn" | b64dec -}}
{{- end -}}

{{- $newRelicLicenseKey := .Values.global.newRelicLicenseKey | default "" -}}
{{- if and (not $newRelicLicenseKey) (hasKey $existingData "newrelic-license-key") -}}
{{- $newRelicLicenseKey = index $existingData "newrelic-license-key" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "novu.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ $jwtSecret | b64enc | quote }}
  store-encryption-key: {{ $storeEncryptionKey | b64enc | quote }}
  novu-secret-key: {{ $novuSecretKey | b64enc | quote }}
  aws-access-key-id: {{ $awsAccessKeyId | b64enc | quote }}
  aws-secret-access-key: {{ $awsSecretAccessKey | b64enc | quote }}
  sentry-dsn: {{ $sentryDsn | b64enc | quote }}
  newrelic-license-key: {{ $newRelicLicenseKey | b64enc | quote }}
