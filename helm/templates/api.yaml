{{- if .Values.api.enabled }}
{{- $secretName := printf "%s-secrets" (include "novu.fullname" .) }}
{{- $mongodbSecretName := printf "%s-mongodb-secret" (include "novu.fullname" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "novu.fullname" . }}-api
  labels:
    {{- include "novu.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: novu-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: novu-api
    spec:
      containers:
        - name: {{ .Chart.Name }}-api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: IfNotPresent
          {{- if .Values.api.resources }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- end }}
          env:
            - name: NODE_ENV
              value: production
            - name: LOG_LEVEL
              value: {{ .Values.global.logLevel | default "info" | quote }}
            - name: API_ROOT_URL
              value: {{ .Values.global.apiRootUrl | quote }}
            - name: PORT
              value: {{ .Values.global.apiPort | quote }}
            - name: FRONT_BASE_URL
              value: {{ .Values.global.frontBaseURL | quote }}
            - name: DASHBOARD_URL
              value: {{ .Values.global.dashboardUrl | default .Values.global.frontBaseURL | quote }}
            {{- if .Values.mongodb.enabled }}
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $mongodbSecretName }}
                  key: username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $mongodbSecretName }}
                  key: password
            {{- end }}
            - name: MONGO_URL
              value: {{ include "novu.mongoUrl" . | quote }}
            - name: MONGO_MIN_POOL_SIZE
              value: {{ .Values.global.mongoMinPoolSize | quote }}
            - name: MONGO_MAX_POOL_SIZE
              value: {{ .Values.global.mongoMaxPoolSize | quote }}
            - name: MONGO_AUTO_CREATE_INDEXES
              value: {{ .Values.global.mongoAutoCreateIndexes | quote }}
            - name: REDIS_HOST
              value: {{ include "novu.redis.host" . | quote }}
            - name: REDIS_PORT
              value: {{ .Values.global.redis.port | quote }}
            - name: REDIS_PASSWORD
              value: {{ .Values.global.redis.password | quote }}
            - name: REDIS_DB_INDEX
              value: {{ .Values.global.redis.dbIndex | quote }}
            - name: REDIS_CACHE_SERVICE_HOST
              value: {{ .Values.global.redisCacheServiceHost | quote }}
            - name: REDIS_CACHE_SERVICE_PORT
              value: {{ .Values.global.redisCacheServicePort | quote }}
            - name: S3_LOCAL_STACK
              value: {{ .Values.global.s3LocalStack | quote }}
            - name: S3_BUCKET_NAME
              value: {{ .Values.global.s3BucketName | quote }}
            - name: S3_REGION
              value: {{ .Values.global.s3Region | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: aws-access-key-id
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: aws-secret-access-key
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: jwt-secret
            - name: STORE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: store-encryption-key
            - name: NOVU_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: novu-secret-key
            - name: SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME
              value: {{ .Values.global.subscriberWidgetJwtExpirationTime | quote }}
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: sentry-dsn
                  optional: true
            - name: NEW_RELIC_ENABLED
              value: {{ .Values.global.newRelicEnabled | quote }}
            - name: NEW_RELIC_APP_NAME
              value: {{ .Values.global.newRelicAppName | quote }}
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: newrelic-license-key
                  optional: true
            - name: GLOBAL_CONTEXT_PATH
              value: {{ include "novu.contextPathEnv" .Values.global.globalContextPath | quote }}
            - name: API_CONTEXT_PATH
              value: {{ include "novu.contextPathEnv" .Values.global.apiContextPath | quote }}
            - name: IS_API_IDEMPOTENCY_ENABLED
              value: {{ .Values.global.isApiIdempotencyEnabled | quote }}
            - name: IS_API_RATE_LIMITING_ENABLED
              value: {{ .Values.global.isApiRateLimitingEnabled | quote }}
            - name: IS_NEW_MESSAGES_API_RESPONSE_ENABLED
              value: {{ .Values.global.isNewMessagesApiResponseEnabled | quote }}
            - name: IS_V2_ENABLED
              value: {{ .Values.global.isV2Enabled | quote }}
            - name: IS_SELF_HOSTED
              value: {{ .Values.global.isSelfHosted | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.global.apiPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ include "novu.api.healthPath" . | quote }}
              port: {{ .Values.global.apiPort }}
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ include "novu.api.healthPath" . | quote }}
              port: {{ .Values.global.apiPort }}
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "novu.fullname" . }}-api
  labels:
    {{- include "novu.labels" . | nindent 4 }}
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.global.apiPort }}
      targetPort: {{ .Values.global.apiPort }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: novu-api
{{- end }}
