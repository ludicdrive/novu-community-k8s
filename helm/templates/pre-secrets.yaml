{{- /*
  This template creates secrets only if they don't already exist.
  Secrets should be created externally and managed outside of Helm for security.
  This template provides a convenient way to initialize them during first install.
  
  IMPORTANT: The chart will NOT overwrite existing secrets. If you've already created
  the required secrets, this template will be skipped (no-op).
*/}}

# MongoDB Admin Secret - Only create if it doesn't exist
{{- $mongodbSecretName := include "novu.fullname" . "-mongodb-secret" }}
{{- if not (lookup "v1" "Secret" $mongodbSecretName (include "novu.namespace" .)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $mongodbSecretName }}
type: Opaque
data:
  username: {{ .Values.global.mongodb.username | default "novu" | b64enc | quote }}
  password: {{ .Values.global.mongodb.password | default "" | b64enc | quote }}
---
{{- end }}

# Application Secrets - Only create if they don't exist
{{- $secretsName := include "novu.fullname" . "-secrets" }}
{{- if not (lookup "v1" "Secret" $secretsName (include "novu.namespace" .)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretsName }}
type: Opaque
data:
  jwt-secret: {{ .Values.global.jwtSecret | default "" | b64enc | quote }}
  store-encryption-key: {{ .Values.global.storeEncryptionKey | default "" | b64enc | quote }}
  novu-secret-key: {{ .Values.global.novuSecretKey | default "" | b64enc | quote }}
  aws-access-key-id: {{ .Values.global.awsAccessKeyId | default "" | b64enc | quote }}
  aws-secret-access-key: {{ .Values.global.awsSecretAccessKey | default "" | b64enc | quote }}
  sentry-dsn: {{ .Values.global.sentryDsn | default "" | b64enc | quote }}
  newrelic-license-key: {{ .Values.global.newRelicLicenseKey | default "" | b64enc | quote }}
---
{{- end }}
