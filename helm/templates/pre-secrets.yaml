{{- /*
  MongoDB credentials secret.

  The secret is created on first install. On upgrades the existing password is
  preserved (unless global.mongodb.password is set explicitly), so the
  connection string and the database credentials never drift apart.
*/ -}}
{{- $name := printf "%s-mongodb-secret" (include "novu.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $username := .Values.global.mongodb.username | default "novu" -}}
{{- $password := .Values.global.mongodb.password | default "" -}}
{{- if and (not $password) $existing (hasKey (default (dict) $existing.data) "password") -}}
{{- $password = index $existing.data "password" | b64dec -}}
{{- end -}}
{{- if not $password -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "novu.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ $username | b64enc | quote }}
  password: {{ $password | b64enc | quote }}
