{{- if .Values.ws.enabled }}
{{- $secretName := printf "%s-secrets" (include "novu.fullname" .) }}
{{- $mongodbSecretName := printf "%s-mongodb-secret" (include "novu.fullname" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "novu.fullname" . }}-ws
  labels:
    {{- include "novu.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: novu-ws
  template:
    metadata:
      labels:
        app.kubernetes.io/name: novu-ws
    spec:
      containers:
        - name: {{ .Chart.Name }}-ws
          image: "{{ .Values.ws.image.repository }}:{{ .Values.ws.image.tag }}"
          imagePullPolicy: IfNotPresent
          {{- if .Values.ws.resources }}
          resources:
            {{- toYaml .Values.ws.resources | nindent 12 }}
          {{- end }}
          env:
            - name: NODE_ENV
              value: production
            - name: LOG_LEVEL
              value: {{ .Values.global.logLevel | default "info" | quote }}
            - name: PORT
              value: {{ .Values.global.wsPort | quote }}
            {{- if .Values.mongodb.enabled }}
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $mongodbSecretName }}
                  key: username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $mongodbSecretName }}
                  key: password
            {{- end }}
            - name: MONGO_URL
              value: {{ include "novu.mongoUrl" . | quote }}
            - name: MONGO_MIN_POOL_SIZE
              value: {{ .Values.global.mongoMinPoolSize | quote }}
            - name: MONGO_MAX_POOL_SIZE
              value: {{ .Values.global.mongoMaxPoolSize | quote }}
            - name: REDIS_HOST
              value: {{ include "novu.redis.host" . | quote }}
            - name: REDIS_PORT
              value: {{ .Values.global.redis.port | quote }}
            - name: REDIS_PASSWORD
              value: {{ .Values.global.redis.password | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: jwt-secret
            - name: GLOBAL_CONTEXT_PATH
              value: {{ include "novu.contextPathEnv" .Values.global.globalContextPath | quote }}
            - name: WS_CONTEXT_PATH
              value: {{ include "novu.contextPathEnv" .Values.global.wsContextPath | quote }}
            - name: NEW_RELIC_ENABLED
              value: {{ .Values.global.newRelicEnabled | quote }}
            - name: NEW_RELIC_APP_NAME
              value: {{ .Values.global.newRelicAppName | quote }}
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: newrelic-license-key
                  optional: true
          ports:
            - name: http
              containerPort: {{ .Values.global.wsPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ include "novu.ws.healthPath" . | quote }}
              port: {{ .Values.global.wsPort }}
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ include "novu.ws.healthPath" . | quote }}
              port: {{ .Values.global.wsPort }}
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "novu.fullname" . }}-ws
  labels:
    {{- include "novu.labels" . | nindent 4 }}
  {{- with .Values.ws.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.global.wsPort }}
      targetPort: {{ .Values.global.wsPort }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: novu-ws
{{- end }}
