{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "novu.fullname" . }}-worker
  labels:
    {{- include "novu.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: novu-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: novu-worker
    spec:
      containers:
        - name: {{ .Chart.Name }}-worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: IfNotPresent
          containerName: worker
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "{{ .Values.global.workerPort }}"
            - name: MONGO_URL
              value: "{{ .Values.global.mongoUrl }}"
            - name: MONGO_MIN_POOL_SIZE
              value: "{{ .Values.global.mongoMinPoolSize }}"
            - name: MONGO_MAX_POOL_SIZE
              value: "{{ .Values.global.mongoMaxPoolSize }}"
            - name: REDIS_HOST
              value: "{{ .Values.global.redis.host }}"
            - name: REDIS_PORT
              value: "{{ .Values.global.redis.port }}"
            - name: REDIS_PASSWORD
              value: "{{ .Values.global.redis.password }}"
            - name: REDIS_DB_INDEX
              value: "2"
            - name: REDIS_CACHE_SERVICE_HOST
              value: "{{ .Values.global.redisCacheServiceHost }}"
            - name: REDIS_CACHE_SERVICE_PORT
              value: "{{ .Values.global.redisCacheServicePort }}"
            - name: S3_LOCAL_STACK
              value: "{{ .Values.global.s3LocalStack }}"
            - name: S3_BUCKET_NAME
              value: "{{ .Values.global.s3BucketName }}"
            - name: S3_REGION
              value: "{{ .Values.global.s3Region }}"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "novu.fullname" . }}-secrets
                  key: aws-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "novu.fullname" . }}-secrets
                  key: aws-secret-access-key
            - name: STORE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "novu.fullname" . }}-secrets
                  key: store-encryption-key
            - name: SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME
              value: "{{ .Values.global.subscriberWidgetJwtExpirationTime }}"
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "novu.fullname" . }}-secrets
                  key: sentry-dsn
            - name: NEW_RELIC_ENABLED
              value: "{{ .Values.global.newRelicEnabled }}"
            - name: NEW_RELIC_APP_NAME
              value: "{{ .Values.global.newRelicAppName }}"
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "novu.fullname" . }}-secrets
                  key: newrelic-license-key
            - name: BROADCAST_QUEUE_CHUNK_SIZE
              value: "{{ .Values.global.broadcastQueueChunkSize }}"
            - name: MULTICAST_QUEUE_CHUNK_SIZE
              value: "{{ .Values.global.multicastQueueChunkSize }}"
            - name: API_ROOT_URL
              value: "http://api:{{ .Values.global.apiPort }}"
            - name: IS_EMAIL_INLINE_CSS_DISABLED
              value: "{{ .Values.global.isEmailInlineCssDisabled }}"
            - name: IS_USE_MERGED_DIGEST_ID_ENABLED
              value: "{{ .Values.global.isUseMergedDigestIdEnabled }}"
          ports:
            - name: http
              containerPort: {{ .Values.global.workerPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /v1/health-check
              port: 3004
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/health-check
              port: 3004
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: worker-logs
              mountPath: /var/log/worker
              readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "novu.fullname" . }}-worker
  labels:
    {{- include "novu.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.worker.service.annotations | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.global.workerPort }}
      targetPort: {{ .Values.global.workerPort }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: novu-worker
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "novu.fullname" . }}-worker-logs
  labels:
    {{- include "novu.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
{{- end }}
