{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "novu.fullname" . }}-dashboard
  labels:
    {{- include "novu.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: novu-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: novu-dashboard
    spec:
      containers:
        - name: {{ .Chart.Name }}-dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: IfNotPresent
          containerName: dashboard
       {{- if .Values.dashboard.resources }}
         resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
      {{- end }}
          env:
            - name: VITE_API_HOSTNAME
              value: "{{ .Values.global.viteApiHostname }}"
            - name: VITE_WEBSOCKET_HOSTNAME
              value: "{{ .Values.global.viteWebSocketHostname }}"
          volumes:
            - name: dashboard-logs
              persistentVolumeClaim:
                claimName: {{ include "novu.fullname" . }}-dashboard-logs
            - name: mongodb-data
              persistentVolumeClaim:
                claimName: {{ include "novu.fullname" . }}-mongodb-data
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "novu.fullname" . }}-dashboard
  labels:
    {{- include "novu.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.dashboard.service.annotations | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: novu-dashboard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "novu.fullname" . }}-dashboard-logs
  labels: {}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
{{- end }}
