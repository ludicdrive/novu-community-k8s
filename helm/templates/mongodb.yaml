{{- if .Values.mongodb.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "novu.fullname" . }}-mongodb
  labels:
    {{- include "novu.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels: {}
    spec:
      containers:
        - name: {{ .Chart.Name }}-mongodb
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          imagePullPolicy: IfNotPresent
          containerName: mongodb
          {{- if .Values.mongodb.resources }}
          resources:
              {{- toYaml .Values.mongodb.resources | nindent 12 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "novu.fullname" . }}-mongodb-secret
          ports:
            - name: mongo
              containerPort: 27017
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --username
                - "{{ .Values.global.mongodb.username }}"
                - --password
                - "{{ .Values.global.mongodb.password }}"
                - --eval
                - db.adminCommand('ping').ok
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --username
                - "{{ .Values.global.mongodb.username }}"
                - --password
                - "{{ .Values.global.mongodb.password }}"
                - --eval
                - db.adminCommand('ping').ok
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
            - name: mongodb-logs
              mountPath: /var/log/mongodb
              readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "novu.fullname" . }}-mongodb
  labels:
    {{- include "novu.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP
      name: mongo
  selector:
    app.kubernetes.io/name: mongodb
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "novu.fullname" . }}-mongodb-data
  labels:
    {{- include "novu.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.mongodb.persistence.storageClass }}
  storageClassName: {{ .Values.mongodb.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mongodb.persistence.size | default "8Gi" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "novu.fullname" . }}-mongodb-logs
  labels:
    {{- include "novu.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
{{- end }}