          {{- if or .Values.web.env.GLOBAL_CONTEXT_PATH .Values.web.env.WEB_CONTEXT_PATH }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              CONTEXT_PATH="$GLOBAL_CONTEXT_PATH/$WEB_CONTEXT_PATH"
              CONTEXT_PATH="${CONTEXT_PATH#/}"
              CONTEXT_PATH="/${CONTEXT_PATH%/}/"
              if [ "$CONTEXT_PATH" != "//" ]; then
                find /app/dist -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" \) -print0 | while IFS= read -r -d '' f; do
                  sed -i "s|href=\"/assets/|href=\"${CONTEXT_PATH}assets/|g; s|src=\"/assets/|src=\"${CONTEXT_PATH}assets/|g" "$f"
                done
              fi
              exec /app/docker-entrypoint.sh http-server dist -p 4000 -d false --proxy http://localhost:4000?
          {{- end }}