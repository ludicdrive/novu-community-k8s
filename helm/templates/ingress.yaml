{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "novu.fullname" . }}
  labels:
    {{- include "novu.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.api.enabled }}
          - path: {{ include "novu.normalizeContextPath" .Values.global.apiContextPath | default "/api" }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "novu.fullname" . }}-api
                port:
                  number: {{ .Values.global.apiPort }}
          {{- end }}
          {{- if .Values.ws.enabled }}
          - path: {{ include "novu.normalizeContextPath" .Values.global.wsContextPath | default "/ws" }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "novu.fullname" . }}-ws
                port:
                  number: {{ .Values.global.wsPort }}
          {{- end }}
          {{- if .Values.dashboard.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "novu.fullname" . }}-dashboard
                port:
                  number: 4000
          {{- end }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
{{- end }}
